# =============================================================================
#  历史地形图批量裁切与配准工具包 — 配置模板
#  用法: 复制本文件为 config.yaml, 按你的图集修改, 然后依次运行 scripts/01~03
#
#  ⚠ 编码: 本文件必须保存为 UTF-8。
#     用记事本编辑后「另存为」时，右下角的编码请选 UTF-8，不要选 ANSI。
#     存成 ANSI(GBK) 会导致读取时抛 UnicodeDecodeError，程序无法启动。
# =============================================================================

# -----------------------------------------------------------------------------
# 路径 (相对本文件所在目录, 也可以写绝对路径)
# -----------------------------------------------------------------------------
paths:
  input:  ./input            # 原始扫描件目录 (jpg / png / tif)
  crop:   ./work/01_crop     # 裁切成果 (定尺寸灰度 PNG)
  geo:    ./work/02_geo      # 配准成果 (GeoTIFF + 金字塔 + VRT)

# -----------------------------------------------------------------------------
# 裁切参数
# -----------------------------------------------------------------------------
crop:
  # ---------------------------------------------------------------------------
  # 输出尺寸。三种用法，按你的需求选：
  #
  #   ① out_size: [4500, 3500]        强制缩放到这个尺寸（默认）
  #        配合经纬度网格用。图幅本来就要铺满固定的经纬度矩形，
  #        轻微拉伸是预期行为，不必担心。
  #
  #   ② out_size: [4500, 3500]
  #      keep_aspect: true             按内容比例缩放，居中补白
  #        尺寸统一且不会拉伸变形，代价是四周可能有一圈很窄的白边。
  #        当图幅比例与 out_size 差得较多时（例如接近正方形的地图），
  #        必须用它，否则内容会被拉扭。
  #
  #   ③ out_size: null                 保持裁切后的原始像素，不缩放
  #        适用于"只想裁掉黑边白边、不需要统一尺寸"的场景。
  #        这时连文件名规范、图号规则、接图表都不需要 —— 只跑 01_crop.py 即可。
  #
  # ⚠ 只想裁切、不做地理配准的话，跑完 01_crop.py 就可以停了，
  #   不要跑 02_georef.py（它需要从文件名解析图号）。
  # ---------------------------------------------------------------------------
  out_size: [4500, 3500]     # 输出像素尺寸 [宽, 高]；null = 保持原始像素
  keep_aspect: false         # true = 保持比例居中补白；false = 强制拉伸到 out_size
  deskew: true               # 是否自动纠斜
  deskew_range: [-3.0, 3.0]  # 纠斜角度搜索范围 (度), 超出此范围请先手工摆正
  deskew_step: 0.02          # 角度搜索步长 (度)

  # --- 内容边界识别 (决定最终裁到哪) ---
  density_threshold: 0.10    # 内容密度阈值: 某行/列的墨迹占比超过它才算"有内容"
                             #   调大 → 裁得更紧, 但稀疏图幅可能被切掉内容
                             #   调小 → 更保守, 边缘可能留白
  density_window: 20         # 连续窗口: 需连续多少个像素达标才认定边界 (抗噪)

  # --- 外框线带 ---
  outer_band: 0.025          # 排除外框线本身所占的边带比例 (相对外框短边)

  # --- 安全兜底 (宁可留白, 绝不切内容) ---
  safe_ratio: 0.72           # 识别出的内容框小于外框的此比例 → 判为不可信, 回退
  safe_offset: 0.15          # 内容框中心偏离外框中心超过此比例 → 回退
  force_safe: []             # 强制回退的文件名(不含扩展名)列表, 如 ["0217-桐山"]

  # 排除非图幅文件(不含扩展名)。接图表、说明页、封面等切记填在这里,
  # 否则它们会被当成一幅地图走完整流程 —— 这是实践中最容易忽略的坑。
  exclude: []                # 如 ["index", "封面", "说明"]

  # ---------------------------------------------------------------------------
  # 逐幅参数覆盖
  #
  # 用于"个别图幅需要单独放宽参数"的情况。这样就不必为了某一幅去改全局参数,
  # 更不必把几百幅全部重跑一遍 —— 只要:
  #     python scripts/01_crop.py 1117-分水嘴
  # 即可只重做这一幅。
  #
  # 什么情况需要它: 大片湖泊、平原、沙漠等"内容稀疏"的图幅, 边缘墨迹占比低,
  # 全局阈值会把真实内容(地名注记、稀疏等高线)误判为空白而切掉。
  # 典型症状是 crop_report.json 里该幅的 ratios 某一维明显低于 0.9。
  #
  # 例:
  #   per_sheet:
  #     "1117-分水嘴":
  #       density_threshold: 0.06      # 放宽阈值, 保住稀疏的湖区注记
  # ---------------------------------------------------------------------------
  per_sheet: {}

# -----------------------------------------------------------------------------
# 图号 → 经纬度 换算规则
# -----------------------------------------------------------------------------
grid:
  rule: CCRR
  # CCRR = 文件名前两位为列号 C, 后两位为行号 R。
  # 这是民国五万分之一地形图常见的图号编排方式, 下面的默认值对应
  # 图廓经差 15′、纬差 10′, 请按你手上的图集核对后再用。
  #
  #   west  = origin_lon - step_lon * C
  #   south = origin_lat - step_lat * R
  #   east  = west  + step_lon
  #   north = south + step_lat
  #
  ccrr:
    origin_lon: 116.25         # C=0 时的西边界经度
    step_lon:   0.25           # 每列经差 = 15′
    origin_lat: 33.333333333   # R=0 时的南边界纬度
    step_lat:   0.166666667    # 每行纬差 = 10′

  # 文件名解析正则。必须能提取出列号 c 与行号 r (两位数字) 以及图名 name。
  # 例: "2108-瑪瑙觀.jpg" -> c=21, r=8, name=瑪瑙觀
  filename_regex: '^(?P<c>\d{2})(?P<r>\d{2})-(?P<name>.+?)(?:_inner)?\.(?:jpg|jpeg|png|tif|tiff)$'

  # 扫描件编号与图集接图表编号不一致时, 可在此逐幅修正: {"文件名": [C, R]}
  # 例: {"0122-龍湖": [1, 21]}
  overrides: {}

# -----------------------------------------------------------------------------
# 配准参数
# -----------------------------------------------------------------------------
georef:
  epsg: 4326                 # 输出坐标系 (经纬度)
  east_shift_m: 0.0          # 整体东移量(米)。历史地图与现代底图存在系统性
                             # 偏移时可用来对齐; 0 = 不移动。
                             # 换算: Δlon = shift / (111320 * cos(中心纬度))
  metres_per_degree: 111320.0
  overviews: [2, 4, 8, 16, 32]   # 金字塔层级
  compress: DEFLATE          # GeoTIFF 压缩: DEFLATE / LZW / NONE
  nodata: 255                # 无数据值 (灰度图的空白=白)
  vrt_name: mosaic.vrt       # 总镶嵌文件名
